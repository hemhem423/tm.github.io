  <g>
    <rect x="560" y="300" width="200" height="200" fill="#111"/>
    <rect x="580" y="320" width="160" height="160" fill="#fafafa"/>
    <rect x="620" y="350" width="60" height="60" fill="#0b2a52"/>
    <rect x="610" y="420" width="80" height="50" fill="#ff5c24"/>
    <rect x="640" y="435" width="20" height="20" fill="#fafafa"/>
