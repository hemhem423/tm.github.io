    <rect x="1480" y="0" width="40" height="40"/><rect x="1560" y="0" width="40" height="40"/><rect x="1520" y="40" width="40" height="40"/>
    <rect x="0" y="1060" width="40" height="40"/><rect x="80" y="1060" width="40" height="40"/><rect x="40" y="1020" width="40" height="40"/>
    <rect x="1480" y="1060" width="40" height="40"/><rect x="1560" y="1060" width="40" height="40"/><rect x="1520" y="1020" width="40" height="40"/>
  </g>
