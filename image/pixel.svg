  <text x="540" y="610" font-family="'Courier New',monospace" font-size="120" font-weight="bold" fill="#111" letter-spacing="4">PIXEL</text>
  <text x="540" y="710" font-family="'Courier New',monospace" font-size="120" font-weight="bold" fill="#ff5c24" letter-spacing="4">VER.</text>
  <g>
    <rect x="540" y="790" width="60" height="60" fill="#111"/><rect x="620" y="790" width="60" height="60" fill="#ff5c24"/><rect x="700" y="790" width="60" height="60" fill="#4ecdc4"/><rect x="780" y="790" width="60" height="60" fill="#fbc02d"/><rect x="860" y="790" width="60" height="60" fill="#111"/>
    <rect x="540" y="870" width="380" height="24" fill="#111"/>
